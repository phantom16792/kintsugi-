<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kintsugi – Teen Health</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
<header>
<h1>Kintsugi</h1>
<p class="subtitle">Safe, age-appropriate health guidance for teens 13-18</p>
<div id="status" class="status">Checking backend...</div>
</header>

<main>
<section class="card">
<h2>Ask a question</h2>
<textarea id="question" placeholder="Type your question here..."></textarea>
<button id="askBtn">Ask</button>
<div id="result" class="result"></div>
</section>

<section class="card">
<h2>My questions</h2>
<div id="myQuestions">Sign in to view your questions.</div>
</section>

<section class="card">
<h2>Health check</h2>
<button id="healthBtn">Check /health</button>
<pre id="healthOut"></pre>
</section>
</main>

<footer>
© Kintsugi Backend Demo
</footer>
</div>
<script src="app.js"></script>
</body>
</html>
